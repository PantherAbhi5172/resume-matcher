[project]
name = "resume-matcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Chauhan", email = "abhipc5172@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.13.5",
